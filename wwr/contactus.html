<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <style>
        /* Contact form styles - colorful and accessible */
        .contact-container {
            max-width: 760px;
            margin: 2.5em auto;
            padding: 1.5em;
            background: linear-gradient(135deg,#f7fbfc 0%, #e8f4f6 100%);
            border: 1px solid rgba(34,34,34,0.06);
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(16,24,32,0.06);
            font-size: 16px;
        }

        .contact-container h2 {
            margin-top: 0;
            color: #16324f;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
            align-items: center;
        }

        .form-row label {
            width: 160px;
            font-weight: 600;
            color: #1f4665;
        }

        .form-field {
            flex: 1;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cddfe6;
            border-radius: 8px;
            background: #fff;
            font-size: 15px;
            color: #123;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
        }

        textarea { height: 120px; resize: vertical; }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #1abc9c;
            box-shadow: 0 0 0 4px rgba(26,188,156,0.08);
        }

        .checkbox-row { display:flex; align-items:center; gap:10px; margin: 12px 0; }

        .form-actions { text-align: right; margin-top: 16px; }

        .submit-btn {
            background: linear-gradient(180deg,#1abc9c 0%, #16a085 100%);
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(22,160,133,0.25);
        }

        .submit-btn:hover { transform: translateY(-2px); }

        /* Feedback message styles */
        #feedback {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            padding: .75em 1em;
            border-radius: 6px;
            display: none;
            margin: 1em auto;
            max-width: 760px;
        }

        /* Small screens */
        @media (max-width: 680px) {
            .form-row { flex-direction: column; align-items: stretch; }
            .form-row label { width: auto; }
            .form-actions { text-align: center; }
        }
    </style>
</head>

<body>

    <header>
        <!-- Your site header/nav goes here -->
    </header>

    <main>

        <!-- Feedback message (hidden until form submitted) -->
        <div id="feedback"></div>

        <section class="contact-container">
            <h2>Contact & Bookings</h2>
            <p>Have a question about a trip or want help choosing the right package? Fill out the form below and our reservations team will get back to you within 24 hours.</p>

            <form id="contactForm" action="#" method="post" novalidate>
                <div class="form-row">
                    <label for="name">Full name</label>
                    <div class="form-field"><input type="text" id="name" name="user_name" placeholder="Jane Doe" required></div>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <div class="form-field"><input type="email" id="email" name="user_email" placeholder="you@example.com" required></div>
                </div>

                <div class="form-row">
                    <label for="phone">Phone</label>
                    <div class="form-field"><input type="tel" id="phone" name="user_phone" placeholder="(555) 555-5555"></div>
                </div>

                <div class="form-row">
                    <label for="message">Message</label>
                    <div class="form-field"><textarea id="message" name="user_message" placeholder="Tell us about your group and preferred trip"></textarea></div>
                </div>

                <div class="form-actions">
                    <button class="submit-btn" type="submit">Send request</button>
                </div>
            </form>
        </section>

    </main>

    <footer>
        <!-- Your footer content -->
    </footer>

    <!-- JavaScript -->
    <script>
        (function(){
            const feedbackElement = document.getElementById('feedback');
            const form = document.getElementById('contactForm');

            form.addEventListener('submit', function(e){
                e.preventDefault();

                const name = form.user_name.value || 'Friend';
                const email = form.user_email.value || '';

                feedbackElement.innerHTML = `Thanks <strong>${name}</strong>! We received your message. We'll contact you at <strong>${email}</strong> soon.`;
                feedbackElement.style.display = 'block';
                feedbackElement.style.backgroundColor = '#e9f9f2';

                // keep the form content visible for the user to review if needed
            });
        })();
    </script>

</body>
</html>
